# Playwright e2e suites for OJS/OMP/OPS. All mechanics live in the reusable
# run-app.yml (also called by the thin hook workflows in the app repos);
# this file is just the three-app matrix and its triggers.
#
# Until the minimal main-repo changes merge upstream, the apps are the
# REDUCED e2e_ng_2 branches (Config.php PKP_CONFIG_FILE + OPS cast).
# Flip app_ref to main afterwards (and app_repo to pkp/<app> if desired).
name: e2e

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '17 3 * * *' # nightly against the app branches below
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ojs:
    # Like pkp's schedule.yml: the nightly runs only on the canonical repo.
    if: github.event_name != 'schedule' || github.repository == 'jardakotesovec/pkp-e2e'
    uses: ./.github/workflows/run-app.yml
    with:
      app: ojs
      app_repo: jardakotesovec/ojs
      app_ref: e2e_ng_2
  omp:
    # Like pkp's schedule.yml: the nightly runs only on the canonical repo.
    if: github.event_name != 'schedule' || github.repository == 'jardakotesovec/pkp-e2e'
    uses: ./.github/workflows/run-app.yml
    with:
      app: omp
      app_repo: jardakotesovec/omp
      app_ref: e2e_ng_2
  ops:
    # Like pkp's schedule.yml: the nightly runs only on the canonical repo.
    if: github.event_name != 'schedule' || github.repository == 'jardakotesovec/pkp-e2e'
    uses: ./.github/workflows/run-app.yml
    with:
      app: ops
      app_repo: jardakotesovec/ops
      app_ref: e2e_ng_2
