# Playwright e2e suites for OJS/OMP/OPS. All mechanics live in the reusable
# run-app.yml (also called by the thin hook workflows in the app repos);
# this file is just the three-app matrix and its triggers.
#
# The apps are pkp upstream main (the once-needed reduced e2e_ng_2 branches
# were retired 2026-08-27 — their two one-liners, Config.php PKP_CONFIG_FILE
# and the OPS wordCount cast, are merged upstream).
name: e2e

on:
  push:
    branches: ['*']
    # Specs, tracking files and kept probe scripts change no test result; a
    # push touching only those queues nothing (2026-10-01: ~260 such pushes
    # in a day had queued 130+ full runs).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'shared/playwright/checks/**'
  pull_request:
    branches: ['main']
  schedule:
    - cron: '17 3 * * *' # nightly against the app branches below
  # Dispatch can pin any app to an exact repo/ref (e.g. a PR's merge sha) and,
  # via --ref, run the suite from any pkp-e2e branch — the fix-verification
  # combo: `gh workflow run e2e.yml --ref <fix-branch> -f ojs_ref=<sha>`.
  workflow_dispatch:
    inputs:
      ojs_repo:
        description: owner/name of the OJS repo to test
        type: string
        default: pkp/ojs
      ojs_ref:
        description: OJS git ref (branch or sha)
        type: string
        default: main
      omp_repo:
        description: owner/name of the OMP repo to test
        type: string
        default: pkp/omp
      omp_ref:
        description: OMP git ref (branch or sha)
        type: string
        default: main
      ops_repo:
        description: owner/name of the OPS repo to test
        type: string
        default: pkp/ops
      ops_ref:
        description: OPS git ref (branch or sha)
        type: string
        default: main
      pkp_lib_ref:
        description: pin every app's lib/pkp to this pkp/pkp-lib commit (full sha or pull/<n>/head)
        type: string
        default: ''
      ui_library_ref:
        description: pin every app's lib/ui-library to this pkp/ui-library commit (full sha or pull/<n>/head)
        type: string
        default: ''
      apps:
        description: the apps to run, comma-separated (a PR on one app need not run the other two)
        type: string
        default: 'ojs,omp,ops'
      line:
        description: a stable version's folder to run the suite from (lines/<line>/, e.g. ore or stable-3_5_0); empty runs main's suite. Name the app refs of that version with it (ojs_ref ore).
        type: string
        default: ''
      php_ini_values:
        description: extra php.ini values for setup-php, comma-separated, after the job's opcache.jit=disable (e.g. opcache.jit=1235 for a run with the JIT)
        type: string
        default: ''
      php_version:
        description: the PHP to run on, 8.3 or 8.2 (one configuration of the daily e2e-matrix run, for a re-run or a PR)
        type: string
        default: '8.3'
      database:
        description: pgsql, mysql (8.0) or mariadb (10.11)
        type: string
        default: pgsql

# A newer push to a branch cancels its older run, except on main: parallel
# slots push there, and each push's own run is its gate (RUNBOOK step 10),
# so every main commit gets its own group. A dispatch is always its own
# group: two slots' PR reviews dispatch from the same commit (bin/ci.js).
concurrency:
  group: e2e-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: true

jobs:
  ojs:
    # Like pkp's schedule.yml: the nightly runs only on the canonical repo.
    if: (github.event_name != 'schedule' || github.repository == 'jardakotesovec/pkp-e2e') && contains(format(',{0},', inputs.apps || 'ojs,omp,ops'), ',ojs,')
    uses: ./.github/workflows/run-app.yml
    with:
      app: ojs
      app_repo: ${{ inputs.ojs_repo || 'pkp/ojs' }}
      app_ref: ${{ inputs.ojs_ref || 'main' }}
      e2e_ref: ${{ github.sha }}
      line: ${{ inputs.line || '' }}
      pkp_lib_ref: ${{ inputs.pkp_lib_ref || '' }}
      ui_library_ref: ${{ inputs.ui_library_ref || '' }}
      php_ini_values: ${{ inputs.php_ini_values || '' }}
      php_version: ${{ inputs.php_version || '8.3' }}
      database: ${{ inputs.database || 'pgsql' }}
  omp:
    # Like pkp's schedule.yml: the nightly runs only on the canonical repo.
    if: (github.event_name != 'schedule' || github.repository == 'jardakotesovec/pkp-e2e') && contains(format(',{0},', inputs.apps || 'ojs,omp,ops'), ',omp,')
    uses: ./.github/workflows/run-app.yml
    with:
      app: omp
      app_repo: ${{ inputs.omp_repo || 'pkp/omp' }}
      app_ref: ${{ inputs.omp_ref || 'main' }}
      e2e_ref: ${{ github.sha }}
      line: ${{ inputs.line || '' }}
      pkp_lib_ref: ${{ inputs.pkp_lib_ref || '' }}
      ui_library_ref: ${{ inputs.ui_library_ref || '' }}
      php_ini_values: ${{ inputs.php_ini_values || '' }}
      php_version: ${{ inputs.php_version || '8.3' }}
      database: ${{ inputs.database || 'pgsql' }}
  ops:
    # Like pkp's schedule.yml: the nightly runs only on the canonical repo.
    if: (github.event_name != 'schedule' || github.repository == 'jardakotesovec/pkp-e2e') && contains(format(',{0},', inputs.apps || 'ojs,omp,ops'), ',ops,')
    uses: ./.github/workflows/run-app.yml
    with:
      app: ops
      app_repo: ${{ inputs.ops_repo || 'pkp/ops' }}
      app_ref: ${{ inputs.ops_ref || 'main' }}
      e2e_ref: ${{ github.sha }}
      line: ${{ inputs.line || '' }}
      pkp_lib_ref: ${{ inputs.pkp_lib_ref || '' }}
      ui_library_ref: ${{ inputs.ui_library_ref || '' }}
      php_ini_values: ${{ inputs.php_ini_values || '' }}
      php_version: ${{ inputs.php_version || '8.3' }}
      database: ${{ inputs.database || 'pgsql' }}
  # The ore version (pkp/ojs `ore`, OJS only; docs/process/VERSIONS.md):
  # its suite is the folder lines/ore/. Nightly here; pushes and PRs on
  # pkp/ojs `ore` run it through that repo's hook.
  ojs-ore:
    if: github.event_name == 'schedule' && github.repository == 'jardakotesovec/pkp-e2e'
    uses: ./.github/workflows/run-app.yml
    with:
      app: ojs
      app_repo: pkp/ojs
      app_ref: ore
      e2e_ref: ${{ github.sha }}
      line: ore
