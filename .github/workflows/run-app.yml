# Reusable single-app runner: everything needed to run one app's Playwright
# suite — services, app + pkp-e2e checkouts, mount, config generation, run.
# Called by this repo's e2e.yml matrix AND by the thin per-app hook workflows
# in the application repositories (which pass their own repo/sha).
#
# The suite runs as SHARDS (RUNBOOK "Budget"): one job per shard, each with
# its own Postgres, Mailpit and app install, at four workers. Playwright
# shards only the projects named on the command line and runs their
# dependency projects IN FULL on every shard (a single `--shard` of the
# whole config split the two leaf projects' four tests and re-ran the app
# project on every shard, 2026-09-23), so each shard runs three passes:
# the shared and app projects sharded (setup, one test, as their
# dependency), then the serial project and then the solo project, each
# sharded with `--no-deps` on the now-installed app, which keeps their
# contract (after the parallel project; solo alone). Each pass is split by
# recorded per-test time, not by count (shared/playwright/timed-shards.js
# reads shared/playwright/timings/<app>.json; every shard uploads its fresh
# times as timings-<app>-<n>, which `npm run shard-timings` folds back in).
# The shard count lives here alone (the job name, SHARDS and the matrix);
# the app hooks pick a change up on their next run.
name: run-app

on:
  workflow_call:
    inputs:
      app:
        description: ojs | omp | ops
        required: true
        type: string
      app_repo:
        description: owner/name of the app repository to test
        required: true
        type: string
      app_ref:
        description: git ref of the app repository to test
        required: true
        type: string
      e2e_ref:
        description: >-
          git ref of the pkp-e2e repo to run the suite from. The app repos'
          hook workflows omit it (their checks float on main); this repo's
          e2e.yml passes its own sha so branch/PR runs test their own tree.
        required: false
        type: string
        default: main
      companion_branch:
        description: >-
          branch name of the app PR under test. If a pkp-e2e branch of the
          same name exists, the suite runs from it instead of e2e_ref: that
          branch is the PR's companion, carrying the spec and test updates
          the PR needs (docs/process/MAINTENANCE.md "A developer's PR fails
          the suite"). App hooks pass `github.head_ref || github.ref_name`.
        required: false
        type: string
        default: ''
      pkp_lib_ref:
        description: >-
          pin lib/pkp to this pkp/pkp-lib commit (a full sha or
          pull/<n>/head) instead of the app commit's pointer: a PR review's
          merge result when the app PR carries no submodule bump or has no
          PR of its own. Empty: the pointer as committed.
        required: false
        type: string
        default: ''
      ui_library_ref:
        description: >-
          the same for lib/ui-library (pkp/ui-library)
        required: false
        type: string
        default: ''
      php_ini_values:
        description: >-
          extra php.ini values for setup-php, comma-separated, written
          after the job's own `opcache.jit=disable`, so they win: e.g.
          `opcache.jit=1235` for a run with the tracing JIT setup-php would
          turn on by default. Empty: the JIT stays off, as every app hook
          runs.
        required: false
        type: string
        default: ''

jobs:
  e2e:
    name: e2e (${{ inputs.app }}) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARDS: 3
      APP_REPO: ${{ inputs.app_repo }}
      APP_REF: ${{ inputs.app_ref }}
      PKP_CONFIG_FILE: ${{ github.workspace }}/app/config.test.inc.php
      TEST_API_KEY: ci-test-key
      MAILPIT_URL: http://127.0.0.1:8025
      PLAYWRIGHT_WORKERS: 4
      # The traffic recorder (docs/process/api.md "The traffic map"): every
      # API call the suites make, uploaded below for `npm run api-traffic`.
      PKP_API_TRAFFIC: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pkp
          POSTGRES_PASSWORD: pkp
          POSTGRES_DB: ${{ inputs.app }}_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pkp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 8025:8025
          - 1025:1025

    steps:
      # A pkp-e2e branch named like the app PR's branch is that PR's
      # companion (spec + test updates it needs). Run from it when it exists.
      - name: Resolve the pkp-e2e ref (companion branch or e2e_ref)
        id: e2e
        env:
          COMPANION: ${{ inputs.companion_branch }}
          FALLBACK: ${{ inputs.e2e_ref }}
        run: |
          ref="$FALLBACK"
          if [ -n "$COMPANION" ] && [ "$COMPANION" != "main" ] \
             && git ls-remote --exit-code --heads https://github.com/jardakotesovec/pkp-e2e.git "refs/heads/$COMPANION" >/dev/null 2>&1; then
            ref="$COMPANION"
            echo "companion branch found in pkp-e2e: $COMPANION"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # Explicit repository: when called from an app repo's hook workflow,
      # the default checkout target would be the CALLER's repo.
      - uses: actions/checkout@v4
        with:
          repository: jardakotesovec/pkp-e2e
          ref: ${{ steps.e2e.outputs.ref }}
          path: e2e

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
          submodules: recursive
          fetch-depth: 1

      # A dispatch may pin the shared code to an open pkp-lib or ui-library
      # PR (e2e.yml pkp_lib_ref / ui_library_ref), before the installs read
      # composer.lock and package-lock.json.
      - name: Pin the submodules
        if: inputs.pkp_lib_ref != '' || inputs.ui_library_ref != ''
        working-directory: app
        env:
          PKP_LIB_REF: ${{ inputs.pkp_lib_ref }}
          UI_LIBRARY_REF: ${{ inputs.ui_library_ref }}
        run: |
          pin() {
            [ -n "$3" ] || return 0
            was=$(git -C "$1" rev-parse --short=10 HEAD)
            git -C "$1" fetch --quiet --depth=1 "https://github.com/pkp/$2.git" "$3"
            git -C "$1" checkout --quiet --detach FETCH_HEAD
            git -C "$1" submodule update --quiet --init --recursive --depth=1
            line="$1 pinned to pkp/$2 $3 = $(git -C "$1" rev-parse --short=10 HEAD) (pointer $was)"
            echo "$line"; echo "- $line" >> "$GITHUB_STEP_SUMMARY"
          }
          pin lib/pkp pkp-lib "$PKP_LIB_REF"
          pin lib/ui-library ui-library "$UI_LIBRARY_REF"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, bz2, curl, gd, intl, mbstring, opcache, pdo_pgsql, pgsql, soap, xml, zip
          # The JIT off, as PHP ships and as the VM runs: setup-php turns
          # the tracing JIT on by default, and a crash in JIT-compiled code
          # killed fresh `php -S` workers on CI (ci-triage "A `php -S` worker
          # segfault", 2026-10-02; maintainer's call).
          ini-values: ${{ inputs.php_ini_values && format('opcache.jit=disable, {0}', inputs.php_ini_values) || 'opcache.jit=disable' }}
          coverage: none

      # The evidence a `php -S` segfault leaves (ci-triage "A `php -S` worker
      # segfault", .reports/flake-1002/segv/): the runner's CPU (the tracing
      # JIT's code depends on it) and the PHP settings in force, in the job
      # log and the summary; and core dumps: the cores go to a folder of
      # their own (php-server.js lifts the size limit when PKP_E2E_CORE_DIR
      # is set) and bin/ci-cores.js turns each into a gdb backtrace beside
      # the server logs while the suite runs.
      - name: Runner, PHP and core dumps
        run: |
          cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
          avx512=$(grep -q avx512f /proc/cpuinfo && echo yes || echo no)
          ini=$(php -i | grep -E '^opcache\.(enable|jit|jit_buffer_size|memory_consumption|interned_strings_buffer) ' | sed 's/ => [^=]*$//' | tr '\n' ' ')
          line="runner: $cpu, $(nproc) CPUs, AVX-512 $avx512; $(php -r 'echo PHP_VERSION;'); $ini"
          echo "$line"; echo "- $line" >> "$GITHUB_STEP_SUMMARY"
          cores="$RUNNER_TEMP/cores"; mkdir -p "$cores"; chmod 1777 "$cores"
          sudo sysctl -q -w kernel.core_pattern="$cores/core.%t.%p"
          echo "PKP_E2E_CORE_DIR=$cores" >> "$GITHUB_ENV"
          command -v gdb >/dev/null || sudo apt-get install -y -qq --no-install-recommends gdb >/dev/null 2>&1 \
            || { sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq --no-install-recommends gdb >/dev/null 2>&1; } \
            || echo "::warning::gdb not installed; cores get no backtrace"

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ inputs.app }}-${{ hashFiles('app/lib/pkp/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ inputs.app }}-

      - name: Install PHP dependencies
        working-directory: app
        run: |
          composer --no-ansi --no-interaction --no-progress --working-dir=lib/pkp install --no-dev --optimize-autoloader
          for dir in plugins/generic/citationStyleLanguage plugins/paymethod/paypal; do
            if [ -f "$dir/composer.json" ]; then
              composer --no-ansi --no-interaction --no-progress --working-dir="$dir" install --no-dev --optimize-autoloader
            fi
          done

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the app UI
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        working-directory: e2e
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (+ system deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Mount overlays and generate config.test.inc.php
        working-directory: e2e
        env:
          OJS_ROOT: ${{ github.workspace }}/app
          OMP_ROOT: ${{ github.workspace }}/app
          OPS_ROOT: ${{ github.workspace }}/app
          TEST_DB_NAME: ${{ inputs.app }}_test
          TEST_DB_USERNAME: pkp
          TEST_DB_PASSWORD: pkp
          TEST_FILES_DIR: ${{ runner.temp }}/files-test
        run: |
          mkdir -p "$TEST_FILES_DIR"
          node bin/mount.js ${{ inputs.app }}
          node bin/with-app.js ${{ inputs.app }} shared/playwright/make-test-config.js > "$PKP_CONFIG_FILE"

      - name: Run Playwright suite
        id: suite
        working-directory: e2e
        env:
          OJS_ROOT: ${{ github.workspace }}/app
          OMP_ROOT: ${{ github.workspace }}/app
          OPS_ROOT: ${{ github.workspace }}/app
        run: |
          app=${{ inputs.app }}; shard=${{ matrix.shard }}/${{ env.SHARDS }}; rc=0
          # Each pass writes its own output folder: a run empties its output
          # folder first, so with one folder the solo pass wiped the error
          # contexts of the first two, flaky first attempts included (2026-09-26).
          out=apps/$app/playwright/test-results
          logs=apps/$app/playwright/.server-logs
          node bin/ci-cores.js "$PKP_E2E_CORE_DIR" $logs/cores --watch & cores_pid=$!
          npx playwright test -c configs/$app.config.js --retries=1 --shard=$shard --project=shared --project=$app --output=$out/app || rc=1
          # Reset and bootstrap again before the serial pass (bin/test-app.js):
          # the site-level @solo tests re-save every context of the install, and
          # the app pass leaves hundreds. The setup project is one test, so it
          # is not sharded.
          if ! { node bin/with-app.js $app shared/playwright/reset.js \
                 && npx playwright test -c configs/$app.config.js --retries=1 --project=setup --reporter=line --output=$out/setup; }; then
            echo "::error::the reset before the serial pass failed"; rc=1
          fi
          npx playwright test -c configs/$app.config.js --retries=1 --shard=$shard --project=$app-serial --no-deps --pass-with-no-tests --output=$out/serial || rc=1
          npx playwright test -c configs/$app.config.js --retries=1 --shard=$shard --project=$app-solo --no-deps --pass-with-no-tests --output=$out/solo || rc=1
          # A flaky test (red, then green on the retry) leaves its failed
          # attempt's error-context.md; say so, so the artifact step uploads it.
          if find $out -name error-context.md | grep -q .; then echo "attempt_failed=true" >> "$GITHUB_OUTPUT"; fi
          kill $cores_pid 2>/dev/null || true; node bin/ci-cores.js "$PKP_E2E_CORE_DIR" $logs/cores || true
          exit $rc

      # Every server death of the job, green jobs included (a replayed or
      # retried request hides it from the test results): one log line each
      # with the request it died on, its process's age and its backtrace.
      - name: php -S deaths
        id: deaths
        if: always()
        working-directory: e2e
        run: node bin/server-deaths.js apps/${{ inputs.app }}/playwright/.server-logs

      - name: Upload the deaths' logs and backtraces
        if: always() && steps.deaths.outputs.count != '' && steps.deaths.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: server-deaths-${{ inputs.app }}-${{ matrix.shard }}
          path: e2e/apps/${{ inputs.app }}/playwright/.server-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      # Per-test durations of this shard (timed-shards.js), the input of
      # `npm run shard-timings`; uploaded on red runs too.
      - name: Upload test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ inputs.app }}-${{ matrix.shard }}
          path: e2e/apps/${{ inputs.app }}/playwright/.timings/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      # Every API call this shard's tests made (support/api-traffic.js), the
      # input of `npm run api-traffic`; uploaded on red runs too.
      - name: Upload API traffic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-traffic-${{ inputs.app }}-${{ matrix.shard }}
          path: e2e/apps/${{ inputs.app }}/playwright/.api-traffic/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      # On a red job and on a green one with a flaky test: the failed
      # attempts' error contexts and the worker servers' logs are the only
      # evidence a CI flake leaves (ci-triage "Where to look").
      - name: Upload test artifacts (red or flaky)
        if: failure() || steps.suite.outputs.attempt_failed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ inputs.app }}-${{ matrix.shard }}
          path: |
            e2e/apps/${{ inputs.app }}/playwright/test-results/
            e2e/apps/${{ inputs.app }}/playwright/.server-logs/
          # upload-artifact@v4 skips hidden dirs by default — without this the
          # .server-logs/ half of the path silently uploads nothing.
          include-hidden-files: true
          if-no-files-found: ignore
